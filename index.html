<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean, minimal productivity dashboard with a focus timer, to-do list, and quick links." />
  <title>Life Dashboard</title>

  <!-- Apply theme before first paint to avoid flash -->
  <script>
    (function () {
      var saved = localStorage.getItem('dashboard_theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-brand">
      <!-- Bolt icon -->
      <svg class="brand-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span class="brand-name">Life Dashboard</span>
    </div>
    <!-- Moon icon — JS replaces with sun on dark mode -->
    <button id="theme-toggle" class="btn btn-icon" aria-label="Switch to dark mode" title="Toggle theme">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <!-- MAIN -->
  <main class="main-content">

    <!-- GREETING & CLOCK -->
    <section class="card greeting-card" aria-label="Greeting and clock">
      <div class="clock-display">
        <span id="clock-time" class="clock-time">00:00:00</span>
        <span id="clock-date" class="clock-date">Loading...</span>
      </div>
      <div class="greeting-row">
        <h1 id="greeting-text" class="greeting-text">Good Evening</h1>
        <div class="name-editor" id="name-editor">
          <span id="name-display" class="name-display"></span>
          <!-- JS overwrites innerHTML; initial SVG is a fallback -->
          <button id="name-edit-btn" class="btn btn-ghost btn-sm" aria-label="Edit your name">
            <svg class="btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
            Edit name
          </button>
        </div>
      </div>
      <div id="name-form" class="name-form hidden" role="form" aria-label="Set your name">
        <input id="name-input" class="input" type="text" placeholder="Enter your name..." maxlength="40" aria-label="Your name" />
        <button id="name-save-btn" class="btn btn-primary btn-sm">
          <!-- Check icon -->
          <svg class="btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
          Save
        </button>
        <button id="name-cancel-btn" class="btn btn-ghost btn-sm">
          <!-- X icon -->
          <svg class="btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Cancel
        </button>
      </div>
    </section>

    <!-- TWO-COLUMN GRID -->
    <div class="dashboard-grid">

      <!-- FOCUS TIMER -->
      <section class="card timer-card" aria-label="Pomodoro focus timer">
        <h2 class="card-title">
          <!-- Clock icon -->
          <svg class="title-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Focus Timer
        </h2>

        <div id="timer-display" class="timer-display" aria-live="polite" aria-label="Timer">25:00</div>

        <p id="timer-message" class="timer-message hidden" aria-live="assertive">
          <!-- Bell icon -->
          <svg class="btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Time's up!
        </p>

        <div class="timer-controls">
          <button id="timer-start" class="btn btn-primary">
            <!-- Play icon (filled) -->
            <svg class="btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Start
          </button>
          <button id="timer-stop" class="btn btn-secondary">
            <!-- Pause icon -->
            <svg class="btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            Stop
          </button>
          <button id="timer-reset" class="btn btn-ghost">
            <!-- Rotate-CCW icon -->
            <svg class="btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
            Reset
          </button>
        </div>

        <div class="timer-set-row">
          <label for="timer-duration-input" class="label-sm">Duration (min)</label>
          <input id="timer-duration-input" class="input input-sm" type="number" min="1" max="120" value="25" aria-label="Set timer duration in minutes" />
          <button id="timer-set-btn" class="btn btn-ghost btn-sm">Set</button>
        </div>
      </section>

      <!-- QUICK LINKS -->
      <section class="card links-card" aria-label="Quick links">
        <h2 class="card-title">
          <!-- Chain-link icon -->
          <svg class="title-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          Quick Links
        </h2>

        <div id="links-list" class="links-list" role="list"></div>
        <div id="links-empty" class="empty-state hidden">No links yet. Add one below!</div>

        <div class="links-add-form">
          <input id="link-name-input" class="input input-sm" type="text" placeholder="Name" maxlength="40" aria-label="Link name" />
          <input id="link-url-input"  class="input input-sm" type="text" placeholder="URL"  maxlength="200" aria-label="Link URL" />
          <button id="link-add-btn" class="btn btn-primary btn-sm">
            <!-- Plus icon -->
            <svg class="btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add
          </button>
        </div>
      </section>

      <!-- TO-DO LIST -->
      <section class="card todo-card" aria-label="To-do list">
        <h2 class="card-title">
          <!-- Check-square icon -->
          <svg class="title-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          To-Do List
        </h2>

        <div class="todo-add-row">
          <input id="todo-input" class="input" type="text" placeholder="Add a new task..." maxlength="200" aria-label="New task" />
          <button id="todo-add-btn" class="btn btn-primary">
            <!-- Plus icon -->
            <svg class="btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add
          </button>
        </div>

        <ul id="todo-list" class="todo-list" role="list" aria-label="Task list"></ul>
        <div id="todo-empty" class="empty-state">All clear! Add a task to get started.</div>
      </section>

    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
